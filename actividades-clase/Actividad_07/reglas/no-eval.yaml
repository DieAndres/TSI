rules:
  - id: no-eval-personalizado
    languages:
      - python
    message: "No se permite utilizar eval() porque puede provocar inyeccion de codigo."
    severity: ERROR
    patterns:
      - pattern: eval(...)
    metadata:
      category: security
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      technology:
        - python
